; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs     =
  *_env.ini

[common_avr]
build_flags       =
  -Iinclude
  -Og -g3 -fno-reorder-blocks -Werror
  -Wl,--undefined=_mmcu,--section-start=.mmcu=0x910000
  -Wl,-Map,$BUILD_DIR/firmware.map
build_unflags     = -Os -flto
platform          = atmelavr@~5.1.0
lib_deps          = symlink://../RISC-V-emulator
extra_scripts     =
  copy_hex.py
  lss_avr.py
  size_avr.py
upload_protocol   = arduino
upload_flags      = -e
debug_tool        = simavr

; Linker relaxation for parts with at most 64KB of flash.
[small_flash_avr]
extends           = common_avr
build_flags       =
  ${common_avr.build_flags}
  -Wl,--relax

; Size-optimized build (-Os) for parts with at most 4KB of flash.
[tiny_flash_avr]
extends           = small_flash_avr
build_unflags     = -Og
build_flags       =
  ${small_flash_avr.build_flags}
  -Os

[env:AT90S4434_RV32I]
extends           = tiny_flash_avr
board_build.mcu   = at90s4434
board_build.f_cpu = 8000000L

[env:AT90S8535_RV32I]
