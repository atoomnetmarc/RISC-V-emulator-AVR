; MicroPython AVR envs. The ISA sets mirror the port's min/max firmware.
; Kept separate so Sv32 and the Linux ISA set stay out of these targets.

[micropython-min]
build_flags       =
  -D RVE_E_Zicsr=1

[micropython-max]
extends           = micropython-min
build_flags       =
  ${micropython-min.build_flags}
  -D RVE_E_M=1
  -D RVE_E_C=1
  -D RVE_E_Zba=1
  -D RVE_E_Zbb=1
  -D RVE_E_Zbkb=1
  -D RVE_E_Zbkc=1
  -D RVE_E_Zbkx=1
  -D RVE_E_Zbs=1
  -D RVE_E_Zcb=1
  -D RVE_E_Zcmop=1
  -D RVE_E_Zicond=1
  -D RVE_E_Zihintntl=1
  -D RVE_E_Zihintpause=1
  -D RVE_E_Zimop=1

[env:ATmega1284P_micropython-min]
extends           = common_avr
board             = ATmega1284P
board_build.mcu   = atmega1284p
board_build.f_cpu = 20000000L
lib_deps          =
  ${common_avr.lib_deps}
  symlink://../RISC-V-emulator-Devices
build_flags       =
  ${common_avr.build_flags}
  ${micropython-min.build_flags}
  -D RVE_AVR_LINUX=1

[env:ATmega1284P_micropython-max]
extends           = common_avr
board             = ATmega1284P
board_build.mcu   = atmega1284p
board_build.f_cpu = 20000000L
lib_deps          =
  ${common_avr.lib_deps}
  symlink://../RISC-V-emulator-Devices
build_flags       =
  ${common_avr.build_flags}
  ${micropython-max.build_flags}
  -D RVE_AVR_LINUX=1
