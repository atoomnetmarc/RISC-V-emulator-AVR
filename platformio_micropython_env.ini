; MicroPython AVR envs. The ISA sets mirror the port's min/max firmware.
; Kept separate so Sv32 and the Linux ISA set stay out of these targets.

[micropython-min]
build_flags       =
  -D RVE_E_ZICSR=1

[micropython-max]
extends           = micropython-min
build_flags       =
  ${micropython-min.build_flags}
  -D RVE_E_C=1
  -D RVE_E_ZBA=1
  -D RVE_E_ZBB=1
  -D RVE_E_ZBKB=1
  -D RVE_E_ZBKC=1
  -D RVE_E_ZBKX=1
  -D RVE_E_ZBS=1
  -D RVE_E_ZCB=1
  -D RVE_E_ZCMOP=1
  -D RVE_E_ZICOND=1
  -D RVE_E_ZIHINTNTL=1
  -D RVE_E_ZIHINTPAUSE=1
  -D RVE_E_ZIMOP=1

[env:ATmega1284P_micropython-min]
extends           = common_avr
board             = ATmega1284P
board_build.mcu   = atmega1284p
board_build.f_cpu = 20000000L
lib_deps          =
  ${common_avr.lib_deps}
  symlink://../RISC-V-emulator-Devices
build_flags       =
  ${common_avr.build_flags}
  ${micropython-min.build_flags}
  -D RVE_AVR_E_LINUX=1

[env:ATmega1284P_micropython-max]
extends           = common_avr
board             = ATmega1284P
board_build.mcu   = atmega1284p
board_build.f_cpu = 20000000L
lib_deps          =
  ${common_avr.lib_deps}
  symlink://../RISC-V-emulator-Devices
build_flags       =
  ${common_avr.build_flags}
  ${micropython-max.build_flags}
  -D RVE_AVR_E_LINUX=1
